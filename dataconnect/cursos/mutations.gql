# ─────────────────────────────────────────────────────────────────────────────
#  Mutations del conector `cursos`.
# ─────────────────────────────────────────────────────────────────────────────

# Alta o actualización del perfil del alumno que llama.
# Observá que el cliente solo manda `nombre`:
#   - id_expr: "auth.uid"           → el servidor usa el UID del token
#   - email_expr: "auth.token.email" → el servidor usa el email del token
# Ningún usuario puede crear o modificar el perfil de otro.
mutation UpsertAlumno($nombre: String!) @auth(level: USER) {
  alumno_upsert(data: { id_expr: "auth.uid", nombre: $nombre, email_expr: "auth.token.email" })
}

# Inscribe al usuario que llama en un curso.
#   - @auth(level: USER): sin token válido, el servidor rechaza la llamada.
#   - alumnoId_expr: "auth.uid": el alumno sale del token, nunca de una variable
#     (si aceptara $alumnoId, cualquiera podría inscribir a otro → IDOR).
#   - _upsert: si la fila (alumno, curso) ya existe la actualiza en vez de fallar
#     por la clave primaria duplicada → llamarla dos veces deja una sola fila.
mutation Inscribirme($cursoId: UUID!) @auth(level: USER) {
  matricula_upsert(data: { alumnoId_expr: "auth.uid", cursoId: $cursoId })
}

# Da de baja la inscripción del usuario que llama en un curso.
#   - @auth(level: USER): sin login no se puede borrar nada.
#   - La clave se arma con alumnoId_expr: "auth.uid": aunque B conozca el cursoId
#     en el que está A, solo puede borrar la fila (B, curso), nunca la (A, curso).
mutation DarmeDeBaja($cursoId: UUID!) @auth(level: USER) {
  matricula_delete(key: { alumnoId_expr: "auth.uid", cursoId: $cursoId })
}
